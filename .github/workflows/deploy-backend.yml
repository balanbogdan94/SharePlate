name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/scripts/backend-rollback*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: sharePlate-dev-api
  AZURE_RESOURCE_GROUP: rg-shareplate-dev
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test deployment rollback
        run: node --test .github/scripts/backend-rollback.test.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/SharePlate.sln

      - name: Build
        run: dotnet build backend/SharePlate.sln --configuration Release --no-restore -p:InformationalVersion=${{ github.sha }}

      - name: Test
        run: dotnet test backend/SharePlate.Tests/SharePlate.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish backend/SharePlate.API/SharePlate.API.csproj --configuration Release --no-build --output ./publish

      # No client secret here - GitHub exchanges its own OIDC token for an Azure AD token,
      # matching the federated credential we created on sharePlate-dev-managedIdentity.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Stop the old agent immediately before deployment; the API rejects simultaneous instrumentation.
      - name: Snapshot current API and telemetry configuration
        id: snapshot
        run: bash .github/scripts/backend-rollback.sh snapshot
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      - name: Configure SDK telemetry
        id: telemetry
        run: |
          configured=$(az webapp config appsettings list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --query "[?name=='APPLICATIONINSIGHTS_CONNECTION_STRING' && value!=''] | length(@)" -o tsv)
          if [ "$configured" != "1" ]; then
            echo "::error::APPLICATIONINSIGHTS_CONNECTION_STRING must be configured before deploying."
            exit 1
          fi
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings Telemetry__Enabled=true ApplicationInsightsAgent_EXTENSION_VERSION=disabled APPINSIGHTS_JAVASCRIPT_ENABLED=false \
            --output none

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Restore previous API and telemetry configuration
        if: ${{ failure() && steps.snapshot.outcome == 'success' && (steps.telemetry.outcome == 'failure' || steps.deploy.outcome == 'failure') }}
        run: bash .github/scripts/backend-rollback.sh rollback
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      - name: Delete temporary deployment snapshot
        if: ${{ always() }}
        run: bash .github/scripts/backend-rollback.sh cleanup
        env:
          RUNNER_TEMP: ${{ runner.temp }}
