name: CI Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # HUSKY=0 skips the "prepare" git hook install, which is irrelevant in CI.
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Lint
        run: npm run lint

      - name: Unused dependencies and exports
        run: npm run deps:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
