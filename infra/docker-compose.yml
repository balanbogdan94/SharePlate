version: "3.8"
services:
  postgres_db:
    image: postgres:latest
    container_name: shareplate_db
    environment:
      - POSTGRES_USER=shareadmin
      - POSTGRES_PASSWORD=sharepass
      - POSTGRES_DB=shareplate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: shareplate_azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azuritedata:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0

volumes:
  pgdata:
  azuritedata:
