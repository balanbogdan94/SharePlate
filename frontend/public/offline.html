<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafaf9" />
  <title>SharePlate Offline</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafaf9;
      color: #292524;
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    section {
      max-width: 360px;
      border: 1px solid #e7e5e4;
      border-radius: 16px;
      background: #fff;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(28, 25, 23, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.125rem;
    }

    p {
      margin: 12px 0 0;
      color: #57534e;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <main>
    <section>
      <h1>You're offline</h1>
      <p>SharePlate will reconnect automatically when your internet connection returns.</p>
    </section>
  </main>
</body>

</html>
